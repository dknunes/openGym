##############################################################################
# render.yaml — openGym Blueprint for Render.com
#
# Deploy:
#   1. Push this repo to GitHub (or connect the existing repo in Render)
#   2. Go to render.com → New → Blueprint → point to this repo
#   3. Set the required env vars listed below (RP_ID, ORIGIN)
#   4. Deploy
#
# Architecture:
#   - opengym-api : Node.js API (Web Service, Docker from ./api/Dockerfile)
#   - opengym-web : nginx + React (Web Service, Docker from ./web/Dockerfile)
#
# Notes:
#   - The Render free tier spins down after 15 min of inactivity (cold starts).
#     Upgrade to a paid plan for always-on + persistent disk.
#   - Without a persistent disk, data (users, workouts) is wiped on every deploy.
##############################################################################

services:
  ##############################################################################
  # API — Node.js backend (passkeys, per-user JSON data, AI Coach relay)
  ##############################################################################
  - type: web
    name: opengym-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATA_DIR
        value: /data
      # ── Passkey / origin ────────────────────────────────────────────────────
      # After first deploy, set these to the opengym-web service URL.
      # RP_ID = hostname only (no https://, no trailing slash)
      # ORIGIN = full URL (e.g. https://opengym-web.onrender.com)
      - key: RP_ID
        sync: false
      - key: ORIGIN
        sync: false
      - key: RP_NAME
        value: openGym
      # ── Session ─────────────────────────────────────────────────────────────
      - key: SESSION_DAYS
        value: "90"
      - key: TRUST_PROXY
        value: "1"
      # ── Admin (optional) ─────────────────────────────────────────────────────
      # After registering your profile, find your user id and paste it here.
      - key: ADMIN_UIDS
        value: ""
      # ── Language ─────────────────────────────────────────────────────────────
      - key: DEFAULT_LANG
        value: "pt-BR"


  ##############################################################################
  # WEB — nginx + React frontend (proxies /api → opengym-api)
  ##############################################################################
  - type: web
    name: opengym-web
    runtime: docker
    # The web Dockerfile build context is the repo root (needs frontend/ and api/coach/core/)
    dockerfilePath: ./web/Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: NGINX_PORT
        value: "80"
      # On Render, services communicate via their public HTTPS URL.
      # After deploy, set BACKEND to the host of opengym-api (e.g. opengym-api.onrender.com)
      # and PORT to 443 (Render serves HTTPS).
      - key: BACKEND
        fromService:
          name: opengym-api
          type: web
          property: host
      - key: PORT
        value: "443"
      # Use a public DNS resolver (Render doesn't expose Docker's internal 127.0.0.11)
      - key: RESOLVER
        value: "1.1.1.1"
      - key: CF_CONNECTING_IP
        value: ""
      - key: BASE_PATH
        value: ""
      - key: MEDIA_UPLOAD_MAX
        value: "48m"
